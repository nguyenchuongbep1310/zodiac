app:
  name: zodiac-api
  environment: development
  port: 8080
  debug: true
  read_timeout: 15s
  write_timeout: 15s
  ephe_path: "./ephe"

database:
  dsn: "postgres://zodiac_user:zodiac_pass@localhost:5432/zodiac_db?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m
  migrations_path: "file://migrations"

redis:
  address: "localhost:6379"
  password: ""
  db: 0
  pool_size: 10
  dial_timeout: 5s

jwt:
  secret: "change-me-to-a-32-char-secret-key!!"
  access_token_ttl: 15m
  refresh_token_ttl: 168h

log:
  level: debug
  format: console

security:
  # Browsers allowed to call the API directly. Set explicitly in production
  # (ZODIAC_SECURITY_ALLOWED_ORIGINS="https://your-frontend.example").
  allowed_origins:
    - "http://localhost:3000"
  # Reverse-proxy IPs/CIDRs whose X-Forwarded-For is trusted. Leave empty when
  # the API is exposed directly; otherwise client IPs (and rate limits) are spoofable.
  trusted_proxies: []
  max_body_bytes: 65536
  rate_limit_per_minute: 120
  rate_limit_burst: 30
  calculate_rate_limit_per_minute: 10
  calculate_rate_limit_burst: 5
